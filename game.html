<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>캐릭터 똥피하기</title>
<style>
  :root{
    --mg-blue:#005BAC;
    --mg-blue-2:#0B73CE;
    --mg-sky:#EAF5FF;
    --ink:#132238;
    --muted:#65758B;
    --white:#fff;
    --danger:#FF5A5F;
    --good:#23A36D;
    --shadow:0 18px 50px rgba(0,61,118,.18);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 20% 0%,#fff 0 9%,transparent 30%),
      linear-gradient(160deg,#dff1ff 0%,#f7fbff 55%,#e9f6ff 100%);
    overflow:hidden;
    user-select:none;
  }
  button,input{font:inherit}
  .app{
    height:100dvh;
    display:grid;
    grid-template-rows:auto 1fr auto;
    max-width:980px;
    margin:0 auto;
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    gap:10px;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{
    width:42px;height:42px;border-radius:14px;
    background:var(--mg-blue);
    color:#fff;
    display:grid;place-items:center;
    font-weight:900;letter-spacing:-1px;
    box-shadow:0 8px 20px rgba(0,91,172,.25);
  }
  .titlebox{min-width:0}
  h1{font-size:clamp(20px,3vw,30px);line-height:1;margin:0;letter-spacing:-1px}
  .subtitle{font-size:12px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tools{display:flex;gap:7px}
  .iconbtn,.btn{
    border:0;border-radius:12px;cursor:pointer;font-weight:800;
    transition:.15s transform,.15s opacity,.15s background;
  }
  .iconbtn{width:42px;height:42px;background:#fff;box-shadow:0 6px 18px rgba(0,40,90,.10);font-size:19px}
  .iconbtn:active,.btn:active{transform:scale(.97)}
  .stageWrap{
    min-height:0;
    position:relative;
    background:#fff;
    border:1px solid rgba(0,91,172,.10);
    border-radius:26px;
    overflow:hidden;
    box-shadow:var(--shadow);
  }
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .hud{
    position:absolute;z-index:3;top:12px;left:12px;right:12px;
    display:flex;justify-content:space-between;gap:10px;pointer-events:none
  }
  .pill{
    background:rgba(255,255,255,.90);backdrop-filter:blur(8px);
    padding:9px 12px;border-radius:999px;
    font-size:13px;font-weight:900;
    box-shadow:0 6px 18px rgba(0,40,90,.10)
  }
  .hud strong{color:var(--mg-blue)}
  .overlay{
    position:absolute;inset:0;z-index:5;
    display:grid;place-items:center;
    padding:20px;
    background:linear-gradient(rgba(232,246,255,.55),rgba(255,255,255,.82));
    backdrop-filter:blur(4px);
  }
  .overlay.hidden{display:none}
  .card{
    width:min(92%,460px);
    padding:28px 24px;
    border-radius:26px;
    background:rgba(255,255,255,.96);
    box-shadow:0 20px 60px rgba(0,50,100,.22);
    text-align:center;
  }
  .heroMascot{font-size:70px;line-height:1;margin-bottom:10px}
  .card h2{margin:0;font-size:28px;letter-spacing:-1px}
  .card p{margin:10px 0 18px;color:var(--muted);font-size:14px;line-height:1.6}
  .actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .btn{padding:12px 17px;background:#edf3f8;color:var(--ink)}
  .btn.primary{background:var(--mg-blue);color:#fff}
  .btn.ghost{background:#fff;border:1px solid #dbe7f1}
  .micro{font-size:11px;color:#8795a8;margin-top:13px}
  .bottom{
    display:flex;
    gap:10px;
    align-items:stretch;
  }
  .help{
    flex:1;
    border-radius:16px;
    padding:10px 13px;
    background:rgba(255,255,255,.82);
    font-size:12px;
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  .mobileBtns{display:none;gap:8px}
  .movebtn{
    width:70px;border:0;border-radius:16px;background:var(--mg-blue);color:#fff;font-size:23px;font-weight:900
  }
  .settings{
    position:absolute;z-index:8;inset:0;
    display:none;align-items:center;justify-content:center;
    background:rgba(16,36,58,.35);backdrop-filter:blur(5px);padding:18px;
  }
  .settings.open{display:flex}
  .settingsPanel{
    width:min(94%,440px);background:#fff;border-radius:24px;padding:20px;box-shadow:var(--shadow)
  }
  .settingsPanel h3{margin:0 0 14px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid #edf2f6}
  .row:last-child{border-bottom:0}
  .row label{font-size:13px;font-weight:800}
  .row small{display:block;color:var(--muted);font-weight:500;margin-top:3px}
  .switch{width:48px;height:28px;border-radius:20px;background:#cbd5df;padding:3px;cursor:pointer}
  .switch span{display:block;width:22px;height:22px;background:#fff;border-radius:50%;transition:.2s}
  .switch.on{background:var(--mg-blue)}
  .switch.on span{transform:translateX(20px)}
  input[type=file]{max-width:185px;font-size:11px}
  @media(max-width:640px){
    .app{padding:8px;gap:8px}
    .subtitle{display:none}
    .mobileBtns{display:flex}
    .help{justify-content:flex-start;text-align:left}
    .tools .iconbtn:first-child{display:none}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">MG</div>
      <div class="titlebox">
        <h1>캐릭터 똥피하기 💩</h1>
        <div class="subtitle">배경 제거된 캐릭터로 똥을 피해 오래 살아남으세요!</div>
      </div>
    </div>
    <div class="tools">
      <button class="iconbtn" id="pauseBtn" aria-label="일시정지">⏸️</button>
      <button class="iconbtn" id="settingsBtn" aria-label="설정">⚙️</button>
    </div>
  </header>

  <main class="stageWrap" id="stageWrap">
    <canvas id="game" aria-label="김금고 똥피하기 게임"></canvas>

    <div class="hud">
      <div class="pill">점수 <strong id="score">0</strong></div>
      <div class="pill">최고 <strong id="best">0</strong></div>
      <div class="pill">레벨 <strong id="level">1</strong></div>
    </div>

    <section class="overlay" id="overlay">
      <div class="card">
        <div class="heroMascot">🧰</div>
        <h2 id="overlayTitle">김금고의 똥피하기</h2>
        <p id="overlayText">
          ← → 또는 A / D 키로 캐릭터를 움직이세요.<br>
          모바일에서는 화면을 드래그하거나 아래 버튼을 눌러 이동합니다.
        </p>
        <div class="actions">
          <button class="btn primary" id="startBtn">게임 시작</button>
          <button class="btn ghost" id="resetBestBtn">최고점수 초기화</button>
        </div>
        <div class="micro">10점마다 레벨이 오르고 똥이 더 빠르고 많이 떨어집니다.</div>
      </div>
    </section>

    <section class="settings" id="settings">
      <div class="settingsPanel">
        <h3>게임 설정</h3>
        <div class="row">
          <label>효과음<small>충돌·점수 효과음</small></label>
          <div class="switch on" id="soundSwitch"><span></span></div>
        </div>
        <div class="row">
          <label>공식 캐릭터 이미지<small>PNG/JPG를 선택하면 김금고 그림을 교체합니다.</small></label>
          <input type="file" id="characterFile" accept="image/*">
        </div>
        <div class="row">
          <label>난이도<small>시작 속도를 조절합니다.</small></label>
          <select id="difficulty">
            <option value="0.85">쉬움</option>
            <option value="1" selected>보통</option>
            <option value="1.22">어려움</option>
          </select>
        </div>
        <div class="actions" style="margin-top:16px">
          <button class="btn primary" id="closeSettings">확인</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="bottom">
    <div class="help"><b>PC</b>&nbsp; ← → / A D 이동 · Space 일시정지 &nbsp; | &nbsp; <b>모바일</b>&nbsp; 드래그 이동</div>
    <div class="mobileBtns">
      <button class="movebtn" id="leftBtn">←</button>
      <button class="movebtn" id="rightBtn">→</button>
    </div>
  </footer>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('stageWrap');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const settings = document.getElementById('settings');
  const closeSettings = document.getElementById('closeSettings');
  const soundSwitch = document.getElementById('soundSwitch');
  const characterFile = document.getElementById('characterFile');
  const difficultyEl = document.getElementById('difficulty');
  const resetBestBtn = document.getElementById('resetBestBtn');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const levelEl = document.getElementById('level');

  let W=0,H=0,dpr=1;
  let running=false, paused=false, gameOver=false;
  let last=0, spawnTimer=0, score=0, level=1, survived=0;
  let obstacles=[], particles=[], bonuses=[];
  let keys={left:false,right:false};
  let best=Number(localStorage.getItem('kimgeumgoDodgeBest')||0);
  let soundOn=true;
  let difficulty=1;
  let customChar=null;
  let audioCtx=null;

  const player={x:0,y:0,w:86,h:96,speed:430,hitFlash:0};
  bestEl.textContent=best;

  function resize(){
    const r=wrap.getBoundingClientRect();
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=Math.max(320,r.width);
    H=Math.max(420,r.height);
    canvas.width=Math.round(W*dpr);
    canvas.height=Math.round(H*dpr);
    canvas.style.width=W+'px';
    canvas.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    player.y=H-player.h-18;
    player.x=Math.min(Math.max(player.x,8),W-player.w-8);
    if(!running && !gameOver) player.x=(W-player.w)/2;
  }
  new ResizeObserver(resize).observe(wrap);
  window.addEventListener('resize',resize);

  function beep(freq=440,dur=.06,type='sine',vol=.04){
    if(!soundOn) return;
    try{
      audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type=type;o.frequency.value=freq;g.gain.value=vol;
      o.connect(g);g.connect(audioCtx.destination);o.start();
      g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
      o.stop(audioCtx.currentTime+dur);
    }catch(e){}
  }

  function resetGame(){
    score=0;level=1;survived=0;spawnTimer=0;
    obstacles=[];particles=[];bonuses=[];
    player.x=(W-player.w)/2;
    player.y=H-player.h-18;
    scoreEl.textContent=0;levelEl.textContent=1;
    gameOver=false;paused=false;
  }

  function startGame(){
    resetGame();
    running=true;
    overlay.classList.add('hidden');
    last=performance.now();
    requestAnimationFrame(loop);
    beep(660,.08,'triangle');
  }

  function endGame(){
    running=false;gameOver=true;
    if(score>best){
      best=score;
      localStorage.setItem('kimgeumgoDodgeBest',best);
      bestEl.textContent=best;
    }
    beep(140,.25,'sawtooth',.055);
    overlayTitle.textContent='앗! 김금고가 맞았어요 💥';
    overlayText.innerHTML=`최종 점수 <b style="color:#005BAC;font-size:22px">${score}점</b><br>최고 점수 ${best}점 · 레벨 ${level}`;
    startBtn.textContent='다시 도전';
    overlay.classList.remove('hidden');
  }

  function togglePause(){
    if(!running) return;
    paused=!paused;
    pauseBtn.textContent=paused?'▶️':'⏸️';
    if(!paused){last=performance.now();requestAnimationFrame(loop)}
  }

  function addPoop(){
    const size=32+Math.random()*18;
    const baseSpeed=(145+level*16)*difficulty;
    obstacles.push({
      x:12+Math.random()*(W-size-24),
      y:-size-10,
      w:size,h:size,
      speed:baseSpeed+Math.random()*80,
      drift:(Math.random()-.5)*35,
      rot:(Math.random()-.5)*.6
    });
  }

  function addCoin(){
    const size=28;
    bonuses.push({
      x:16+Math.random()*(W-size-32),y:-40,w:size,h:size,
      speed:(130+level*10)*difficulty,spin:0
    });
  }

  function rectHit(a,b,pad=8){
    return a.x+pad < b.x+b.w-pad &&
           a.x+a.w-pad > b.x+pad &&
           a.y+pad < b.y+b.h-pad &&
           a.y+a.h-pad > b.y+pad;
  }

  function burst(x,y,emoji){
    for(let i=0;i<12;i++){
      particles.push({
        x,y,vx:(Math.random()-.5)*220,vy:-50-Math.random()*180,
        life:.65+Math.random()*.35,emoji
      });
    }
  }

  function update(dt){
    if(keys.left) player.x-=player.speed*dt;
    if(keys.right) player.x+=player.speed*dt;
    player.x=Math.max(8,Math.min(W-player.w-8,player.x));

    survived+=dt;
    const newScore=Math.floor(survived*2);
    if(newScore!==score){
      score=newScore;
      scoreEl.textContent=score;
      const newLevel=1+Math.floor(score/10);
      if(newLevel!==level){
        level=newLevel;
        levelEl.textContent=level;
        beep(880,.08,'triangle');
      }
    }

    spawnTimer-=dt;
    if(spawnTimer<=0){
      addPoop();
      const rate=Math.max(.20,.72-level*.035)/difficulty;
      spawnTimer=rate*(.72+Math.random()*.5);
      if(Math.random()<.08) addCoin();
    }

    for(const o of obstacles){
      o.y+=o.speed*dt;
      o.x+=o.drift*dt;
      o.rot+=dt*.6;
      if(rectHit(player,o,12)){
        burst(player.x+player.w/2,player.y+player.h/2,'💥');
        endGame();
        return;
      }
    }
    obstacles=obstacles.filter(o=>o.y<H+80);

    for(const c of bonuses){
      c.y+=c.speed*dt;c.spin+=dt*5;
      if(rectHit(player,c,10)){
        c.dead=true;
        survived+=2.5;
        burst(c.x+c.w/2,c.y+c.h/2,'✨');
        beep(980,.05,'triangle');
      }
    }
    bonuses=bonuses.filter(c=>!c.dead && c.y<H+60);

    for(const p of particles){
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=420*dt;p.life-=dt;
    }
    particles=particles.filter(p=>p.life>0);
  }

  function roundedRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.roundRect(x,y,w,h,r);
  }

  function drawBackground(){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#dff2ff');
    g.addColorStop(.68,'#f8fcff');
    g.addColorStop(1,'#edf8ea');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

    ctx.globalAlpha=.55;
    for(let i=0;i<8;i++){
      const x=(i*137+score*3)% (W+140)-70;
      const y=70+(i%4)*90;
      ctx.fillStyle='#fff';
      ctx.beginPath();
      ctx.ellipse(x,y,46,15,0,0,Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha=1;

    ctx.fillStyle='#d7efcb';
    ctx.fillRect(0,H-38,W,38);
    ctx.fillStyle='#bfe1ae';
    for(let x=0;x<W;x+=30){
      ctx.beginPath();ctx.moveTo(x,H-38);ctx.lineTo(x+12,H-50);ctx.lineTo(x+24,H-38);ctx.fill();
    }
  }

  function drawMascot(){
    const x=player.x,y=player.y,w=player.w,h=player.h;
    if(customChar){
      ctx.save();
      ctx.shadowColor='rgba(0,60,100,.20)';ctx.shadowBlur=12;ctx.shadowOffsetY=6;
      ctx.drawImage(customChar,x,y,w,h);
      ctx.restore();
      return;
    }

    // Self-contained "김금고풍" blue digital safe mascot.
    ctx.save();
    ctx.shadowColor='rgba(0,69,133,.22)';ctx.shadowBlur=12;ctx.shadowOffsetY=7;

    roundedRect(x+5,y+13,w-10,h-16,17);
    const g=ctx.createLinearGradient(x,y,x+w,y+h);
    g.addColorStop(0,'#0d78d2');g.addColorStop(1,'#005BAC');
    ctx.fillStyle=g;ctx.fill();

    ctx.shadowColor='transparent';
    ctx.fillStyle='#fff';
    roundedRect(x+13,y+23,w-26,27,10);ctx.fill();

    ctx.fillStyle='#17324b';
    ctx.beginPath();ctx.arc(x+25,y+35,3.4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x+w-25,y+35,3.4,0,Math.PI*2);ctx.fill();

    ctx.strokeStyle='#17324b';ctx.lineWidth=2.3;ctx.lineCap='round';
    ctx.beginPath();ctx.arc(x+w/2,y+39,9,.2,Math.PI-.2);ctx.stroke();

    ctx.fillStyle='#7cc7ff';
    ctx.beginPath();ctx.arc(x+w-9,y+18,8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='900 8px system-ui';ctx.textAlign='center';ctx.fillText('24',x+w-9,y+21);

    ctx.fillStyle='#fff';ctx.font='900 10px system-ui';ctx.fillText('김금고',x+w/2,y+63);

    ctx.fillStyle='#004481';
    ctx.beginPath();ctx.ellipse(x+17,y+h-3,12,5,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(x+w-17,y+h-3,12,5,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  function drawPoop(o){
    ctx.save();
    ctx.translate(o.x+o.w/2,o.y+o.h/2);
    ctx.rotate(o.rot);
    ctx.font=`${o.w}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('💩',0,1);
    ctx.restore();
  }

  function drawCoin(c){
    ctx.save();
    ctx.translate(c.x+c.w/2,c.y+c.h/2);
    ctx.scale(.55+.45*Math.abs(Math.cos(c.spin)),1);
    ctx.font=`${c.w}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🪙',0,0);
    ctx.restore();
  }

  function draw(){
    drawBackground();
    for(const c of bonuses) drawCoin(c);
    for(const o of obstacles) drawPoop(o);
    drawMascot();

    for(const p of particles){
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.font='18px "Apple Color Emoji","Segoe UI Emoji"';
      ctx.textAlign='center';ctx.fillText(p.emoji,p.x,p.y);
      ctx.globalAlpha=1;
    }
  }

  function loop(now){
    if(!running || paused) return;
    const dt=Math.min(.033,(now-last)/1000||0);
    last=now;
    update(dt);draw();
    if(running) requestAnimationFrame(loop);
  }

  // Keyboard
  window.addEventListener('keydown',e=>{
    if(['ArrowLeft','a','A'].includes(e.key)){keys.left=true;e.preventDefault()}
    if(['ArrowRight','d','D'].includes(e.key)){keys.right=true;e.preventDefault()}
    if(e.code==='Space'){togglePause();e.preventDefault()}
    if(e.key==='Enter' && !running && !settings.classList.contains('open')) startGame();
  });
  window.addEventListener('keyup',e=>{
    if(['ArrowLeft','a','A'].includes(e.key)) keys.left=false;
    if(['ArrowRight','d','D'].includes(e.key)) keys.right=false;
  });

  // Touch / pointer drag
  let dragging=false;
  function moveToPointer(e){
    const r=canvas.getBoundingClientRect();
    const px=e.clientX-r.left;
    player.x=Math.max(8,Math.min(W-player.w-8,px-player.w/2));
  }
  canvas.addEventListener('pointerdown',e=>{dragging=true;canvas.setPointerCapture(e.pointerId);moveToPointer(e)});
  canvas.addEventListener('pointermove',e=>{if(dragging) moveToPointer(e)});
  canvas.addEventListener('pointerup',()=>dragging=false);
  canvas.addEventListener('pointercancel',()=>dragging=false);

  function hold(btn,dir){
    const on=e=>{e.preventDefault();keys[dir]=true};
    const off=e=>{e.preventDefault();keys[dir]=false};
    btn.addEventListener('pointerdown',on);
    btn.addEventListener('pointerup',off);
    btn.addEventListener('pointercancel',off);
    btn.addEventListener('pointerleave',off);
  }
  hold(document.getElementById('leftBtn'),'left');
  hold(document.getElementById('rightBtn'),'right');

  startBtn.addEventListener('click',startGame);
  pauseBtn.addEventListener('click',togglePause);
  resetBestBtn.addEventListener('click',()=>{
    best=0;localStorage.removeItem('kimgeumgoDodgeBest');bestEl.textContent='0';beep(500,.05)
  });

  settingsBtn.addEventListener('click',()=>{
    if(running && !paused) togglePause();
    settings.classList.add('open');
  });
  closeSettings.addEventListener('click',()=>{
    settings.classList.remove('open');
    difficulty=Number(difficultyEl.value);
  });
  soundSwitch.addEventListener('click',()=>{
    soundOn=!soundOn;
    soundSwitch.classList.toggle('on',soundOn);
    if(soundOn) beep(620,.05);
  });
  difficultyEl.addEventListener('change',()=>difficulty=Number(difficultyEl.value));

  characterFile.addEventListener('change',e=>{
    const file=e.target.files?.[0];
    if(!file) return;
    const img=new Image();
    img.onload=()=>{customChar=img;draw()};
    img.src=URL.createObjectURL(file);
  });
